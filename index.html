<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Өдөр</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Өдөр">
<meta name="theme-color" content="#EEF2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1522" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F7; --surface:#FFFFFF; --ink:#172033; --muted:#5E6B82; --line:#D9E0EA; --soft:#E3E9F2;
  --accent:#2747D6; --on-accent:#FFFFFF;
  --c-class:#2747D6; --c-work:#B86F00; --c-gym:#D23C4E; --c-other:#12877A;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1522; --surface:#18202F; --ink:#E8EDF6; --muted:#94A0B6; --line:#2A3447; --soft:#212B3D;
    --accent:#7C95FF; --on-accent:#0F1522;
    --c-class:#7C95FF; --c-work:#F0B24A; --c-gym:#FF7383; --c-other:#3CC7B5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1522; --surface:#18202F; --ink:#E8EDF6; --muted:#94A0B6; --line:#2A3447; --soft:#212B3D;
  --accent:#7C95FF; --on-accent:#0F1522;
  --c-class:#7C95FF; --c-work:#F0B24A; --c-gym:#FF7383; --c-other:#3CC7B5;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.45; -webkit-tap-highlight-color:transparent;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 140px}

/* header */
.day-head{padding:6px 2px 14px}
.day-name{font-family:"Unbounded","Golos Text",sans-serif;font-weight:700;font-size:clamp(34px,10vw,46px);line-height:1.05;letter-spacing:-.01em;margin:0}
.day-meta{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;color:var(--muted)}
.day-meta b{color:var(--ink);font-weight:600}
.band{height:6px;background:var(--soft);border-radius:3px;margin-top:12px;overflow:hidden}
.band i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .35s ease}

/* week strip */
.week{display:flex;align-items:center;gap:4px;margin:4px 0 22px}
.wk-arrow{flex:0 0 32px;height:56px;border:0;background:none;color:var(--muted);font-size:20px;border-radius:10px}
.days{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.d{border:1px solid transparent;background:var(--surface);border-radius:12px;padding:7px 0 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px}
.d small{font-size:11px;color:var(--muted)}
.d span{font-weight:600;font-size:16px}
.d .dot{width:5px;height:5px;border-radius:50%;background:transparent;margin-top:2px}
.d.has .dot{background:var(--muted)}
.d.full .dot{background:var(--accent)}
.d.today{border-color:var(--accent)}
.d.sel{background:var(--accent);color:var(--on-accent)}
.d.sel small{color:inherit;opacity:.8}
.d.sel .dot{background:var(--on-accent)}

/* sections */
.sec{margin-bottom:24px}
.sec h2{font-size:15px;font-weight:600;color:var(--muted);margin:0 0 8px 2px;display:flex;justify-content:space-between}
.sec h2 em{font-style:normal;font-weight:500}
.list{background:var(--surface);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-height:56px}
.row:first-child{border-top:0}
.chk{flex:0 0 26px;height:26px;border-radius:50%;border:2px solid var(--line);background:none;display:grid;place-items:center;padding:0}
.chk svg{width:14px;height:14px;opacity:0;transition:opacity .15s}
.row.done .chk{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.row.done .chk svg{opacity:1}
.row.done .title{text-decoration:line-through;color:var(--muted)}
.body{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0}
.title{display:block;font-weight:500;overflow-wrap:anywhere}
.sub{display:block;font-size:13px;color:var(--muted)}
.time{flex:0 0 auto;font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted);text-align:right;line-height:1.25}
.stripe{flex:0 0 4px;align-self:stretch;border-radius:2px;margin:-2px 0}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 7px;border-radius:6px;margin-right:6px;vertical-align:1px}
.row.now{background:var(--soft)}
.now-tag{font-size:12px;font-weight:600;color:var(--accent)}
.late{color:var(--c-gym);font-weight:600}
.empty{background:var(--surface);border-radius:16px;padding:16px;color:var(--muted);font-size:15px}
.empty button{margin-top:10px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:0}

/* week tab */
.wday{margin-bottom:16px}
.wday h3{font-family:"Unbounded",sans-serif;font-weight:500;font-size:15px;margin:0 0 6px 2px}
.wday h3.is-today{color:var(--accent)}
.page-title{font-family:"Unbounded","Golos Text",sans-serif;font-weight:700;font-size:28px;margin:6px 2px 18px;line-height:1.15}
.hint{color:var(--muted);font-size:14px;margin:-10px 2px 18px}

/* tabbar + fab */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:none;padding:10px 0 12px;font-size:13px;font-weight:500;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--on-accent);font-size:30px;line-height:1;z-index:21;box-shadow:0 6px 18px rgba(39,71,214,.35)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,15,30,.45);z-index:40;display:none}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:22px 22px 0 0;max-height:88vh;overflow:auto;transform:translateY(105%);transition:transform .25s ease;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet.open{transform:none}
.sheet-in{max-width:560px;margin:0 auto;position:relative}
.x{position:absolute;right:-6px;top:-2px;width:40px;height:40px;border:0;border-radius:50%;background:var(--soft);color:var(--muted);font-size:22px;line-height:1}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-family:"Unbounded",sans-serif;font-weight:500;font-size:19px;margin:0 0 14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft);border-radius:12px;padding:3px;margin-bottom:16px}
.seg button{border:0;background:none;border-radius:9px;padding:9px 4px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.field{margin-bottom:14px}
.field label,.field .lbl{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-size:16px;min-height:46px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:none;border-radius:10px;padding:8px 11px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip.cat[aria-pressed="true"]{background:var(--cc);border-color:var(--cc);color:#fff}
.check-line{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin-top:8px}
.actions{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;border:0;border-radius:14px;padding:14px;font-weight:600;font-size:16px}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.danger{flex:0 0 auto;background:none;color:var(--c-gym);border:1px solid var(--line)}
.err{color:var(--c-gym);font-size:14px;margin-top:-6px;margin-bottom:10px;display:none}
.sync{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
/* now / next */
.nn{background:var(--surface);border-radius:16px;margin:0 0 18px;overflow:hidden}
.nn-row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.nn-row:first-child{border-top:0}
.nn-main{flex:1;min-width:0}
.nn-lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.nn-t{display:block;font-weight:600;overflow-wrap:anywhere}
.nn-when{flex:0 0 auto;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.nn-when small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.nn-bar{height:4px;background:var(--soft);border-radius:2px;margin-top:8px;overflow:hidden}
.nn-bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
/* free-time rows */
.row.gap{min-height:40px;padding:8px 14px 8px 30px;font-size:14px;color:var(--muted);background:repeating-linear-gradient(135deg,transparent 0 6px,var(--soft) 6px 7px)}
.gap-t{flex:1}
/* tags + deadlines */
.tag.cls{background:var(--soft);color:var(--ink)}
.tag.exam{background:var(--c-gym);color:var(--on-accent)}
.hw{color:var(--c-work);font-weight:600}
.cd{flex:0 0 auto;font-size:13px;font-weight:600;color:var(--muted);text-align:right}
.cd.soon{color:var(--c-gym)}
.cal-card{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:14px;margin:-4px 0 20px;border:0;width:100%;text-align:left}
.cal-card svg{flex:0 0 28px;height:28px;color:var(--accent)}
.cal-card b{display:block;font-weight:600}
.cal-card span{font-size:13px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:12px 0 0}
/* stats */
.stat-nav{display:flex;align-items:center;gap:6px;margin:-8px 0 16px}
.stat-nav span{flex:1;text-align:center;color:var(--muted);font-size:14px}
.stat-nav button{border:0;background:var(--surface);border-radius:10px;width:40px;height:36px;font-size:20px;color:var(--ink)}
.stat-nav button:disabled{opacity:.35}
.card{background:var(--surface);border-radius:16px;padding:16px;margin-bottom:16px}
.card h3{font-size:15px;font-weight:600;color:var(--muted);margin:0 0 10px}
.hero-n{font-family:"Unbounded","Golos Text",sans-serif;font-weight:700;font-size:42px;line-height:1}
.hero-s{color:var(--muted);margin-top:6px}
.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:18px}
.bar{display:flex;flex-direction:column;align-items:center;gap:3px}
.track{position:relative;width:100%;max-width:30px;height:110px;background:var(--soft);border-radius:4px;overflow:hidden}
.track i{position:absolute;left:0;right:0;bottom:0;background:var(--accent);border-radius:4px 4px 0 0}
.track.fut{background:none;border:1px dashed var(--line)}
.bar small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar.is-today small:first-of-type{color:var(--ink);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.tile{background:var(--surface);border-radius:14px;padding:12px}
.tile b{display:block;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.rt{padding:10px 0;border-top:1px solid var(--line)}
.rt:first-of-type{border-top:0;padding-top:0}
.rt-h{display:flex;justify-content:space-between;gap:10px}
.rt-h span{color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}
.dots{display:flex;gap:6px;margin-top:6px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line)}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.dots i.na{border-color:transparent;background:radial-gradient(circle,var(--line) 2px,transparent 3px)}
.dots i.fut{border-style:dashed;opacity:.6}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid var(--line);vertical-align:-1px;margin-right:4px}
.legend i.on{background:var(--accent);border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>

<button class="fab" id="fab" aria-label="Шинээр нэмэх">+</button>

<nav class="tabbar" aria-label="Цэс">
  <div class="tabbar-in">
    <button class="tab" data-tab="day" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Өдөр</button>
    <button class="tab" data-tab="week">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Хуваарь</button>
    <button class="tab" data-tab="routines">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>Өдөр бүр</button>
    <button class="tab" data-tab="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Дүн</button>
  </div>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="sheet-in" id="sheetIn"></div></div>

<script>
(() => {
const KEY = "udur-app-v1";
const DAYS = ["Даваа","Мягмар","Лхагва","Пүрэв","Баасан","Бямба","Ням"];
const DS = ["Да","Мя","Лх","Пү","Ба","Бя","Ня"];
const CATS = {class:{n:"Хичээл",v:"--c-class"},work:{n:"Ажил",v:"--c-work"},gym:{n:"Gym",v:"--c-gym"},other:{n:"Бусад",v:"--c-other"}};
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

const blank = () => ({v:1, updatedAt:0, blocks:[], routines:[], todos:[], checks:{}, seeded:[]});
let state = blank();
try { const s = localStorage.getItem(KEY); if (s) state = Object.assign(blank(), JSON.parse(s)); } catch(e){}

let tab = "day", statOff = 0;
let sel = new Date(); sel.setHours(0,0,0,0);

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,"0");
const key = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const wd = d => (d.getDay()+6)%7;
const today = () => { const t=new Date(); t.setHours(0,0,0,0); return t; };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const fromKey = k => { const [y,m,dd]=k.split("-").map(Number); return new Date(y,m-1,dd); };
const tmin = t => { if(!t) return 9999; const [h,m]=t.split(":").map(Number); return h*60+m; };
const fromMin = m => pad(Math.floor(m/60))+":"+pad(m%60);
const fmtDur = m => m<60 ? m+" мин" : Math.floor(m/60)+" цаг"+(m%60?" "+(m%60)+" мин":"");
const dayDiff = (a,b) => Math.round((b-a)/864e5);
const classTitles = () => [...new Set(state.blocks.filter(b=>b.cat==="class").map(b=>b.title))];
function shortCls(title){
  const b = state.blocks.find(x=>x.title===title && x.place);
  const m = b && b.place.match(/\b[A-Z]{3,5}\d{3}\b/);
  return m ? m[0] : (title.length>18 ? title.slice(0,17)+"…" : title);
}
const todoTags = x => (x.exam?`<span class="tag exam">Шалгалт</span>`:"") + (x.cls?`<span class="tag cls">${esc(shortCls(x.cls))}</span>`:"");
const daysLabel = arr => arr.length===7 ? "Өдөр бүр" : (arr.length===5 && [0,1,2,3,4].every(i=>arr.includes(i))) ? "Ажлын өдрүүд" : arr.slice().sort().map(i=>DS[i]).join(", ");

/* ---------- storage + sync ---------- */
let ref=null, writing=false, pending=false, timer=null, syncNote="";
function persist(){
  state.updatedAt = Date.now();
  // keep checks for 90 days
  const cutoff = key(addDays(today(),-90));
  for (const k of Object.keys(state.checks)) if (k < cutoff) delete state.checks[k];
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){}
  if (ref){ clearTimeout(timer); timer = setTimeout(flush, 700); }
}
async function flush(){
  if (!ref) return;
  if (writing){ pending = true; return; }
  writing = true;
  try { await ref.set(JSON.parse(JSON.stringify(state))); syncNote=""; }
  catch(e){ syncNote = "Сервер рүү хадгалж чадсангүй, энэ утсан дээр хадгалагдсан."; }
  writing = false;
  if (pending){ pending=false; flush(); }
}

/* ---------- day computations ---------- */
function itemsFor(d){
  const w = wd(d), k = key(d);
  const blocks = state.blocks.filter(b=>b.days.includes(w)).sort((a,b)=>tmin(a.start)-tmin(b.start));
  const routines = state.routines.filter(r=>r.days.includes(w)).sort((a,b)=>tmin(a.time)-tmin(b.time));
  const todos = state.todos.filter(t=>t.date===k).sort((a,b)=>(a.done-b.done)||tmin(a.time)-tmin(b.time));
  const checked = new Set(state.checks[k]||[]);
  const total = blocks.length+routines.length+todos.length;
  const done = blocks.filter(b=>checked.has(b.id)).length + routines.filter(r=>checked.has(r.id)).length + todos.filter(t=>t.done).length;
  return {blocks,routines,todos,checked,total,done};
}

/* ---------- render ---------- */
const app = document.getElementById("app");
function render(){
  document.querySelectorAll(".tab").forEach(b => b.toggleAttribute("aria-current", false) || (b.dataset.tab===tab && b.setAttribute("aria-current","page")));
  if (tab==="day") renderDay(); else if (tab==="week") renderWeek(); else if (tab==="stats") renderStats(); else renderRoutines();
}

function renderDay(){
  const t = today(), isToday = +sel===+t;
  const it = itemsFor(sel), k = key(sel);
  const pct = it.total ? Math.round(it.done/it.total*100) : 0;
  const mon = addDays(sel, -wd(sel));
  const now = new Date(), nowMin = now.getHours()*60+now.getMinutes();

  let h = `<header class="day-head">
    <h1 class="day-name">${DAYS[wd(sel)]}</h1>
    <div class="day-meta"><span>${sel.getMonth()+1}-р сарын ${sel.getDate()}${isToday?", өнөөдөр":""}</span>
    <span>${it.total ? `<b>${it.done}/${it.total}</b> хийсэн` : ""}</span></div>
    <div class="band" aria-hidden="true"><i style="width:${pct}%"></i></div>
  </header>${isToday ? nowNextHTML() : ""}
  <div class="week">
    <button class="wk-arrow" data-act="wk" data-n="-7" aria-label="Өмнөх 7 хоног">‹</button>
    <div class="days">`;
  for (let i=0;i<7;i++){
    const d = addDays(mon,i), x = itemsFor(d);
    const cls = ["d", +d===+sel?"sel":"", +d===+t?"today":"", x.total?"has":"", x.total&&x.done===x.total?"full":""].join(" ");
    h += `<button class="${cls}" data-act="pick" data-k="${key(d)}" aria-label="${DAYS[i]} ${d.getDate()}"><small>${DS[i]}</small><span>${d.getDate()}</span><i class="dot"></i></button>`;
  }
  h += `</div><button class="wk-arrow" data-act="wk" data-n="7" aria-label="Дараагийн 7 хоног">›</button></div>`;

  // schedule
  h += `<section class="sec"><h2>Хуваарь</h2>`;
  if (it.blocks.length){
    const rows = []; let lastEnd = null;
    it.blocks.forEach(b => {
      if (lastEnd!==null && tmin(b.start)-lastEnd>=30) rows.push(gapRow(lastEnd, tmin(b.start)));
      rows.push(b); lastEnd = Math.max(lastEnd??0, tmin(b.end));
    });
    if (lastEnd!==null && lastEnd<22*60) rows.push(`<div class="row gap"><span class="gap-t">Чөлөөт цаг</span><span class="time">${fromMin(lastEnd)}-аас хойш</span></div>`);
    h += `<div class="list">` + rows.map(b => {
      if (typeof b==="string") return b;
      const c = CATS[b.cat]||CATS.other, on = it.checked.has(b.id);
      const live = isToday && nowMin>=tmin(b.start) && nowMin<tmin(b.end);
      const hw = b.cat==="class" ? state.todos.filter(x=>!x.done && x.cls===b.title).length : 0;
      return `<div class="row ${on?"done":""} ${live?"now":""}">
        <span class="stripe" style="background:var(${c.v})"></span>
        <button class="chk" data-act="tick" data-id="${b.id}" aria-label="Хийсэн гэж тэмдэглэх" aria-pressed="${on}">${CHECK}</button>
        <button class="body" data-act="edit" data-kind="block" data-id="${b.id}">
          <span class="title">${esc(b.title)}</span>
          <span class="sub">${c.n}${b.place?", "+esc(b.place):""}${live?` <span class="now-tag">· одоо</span>`:""}${hw?` · <span class="hw">${hw} даалгавар</span>`:""}</span>
        </button>
        <span class="time">${esc(b.start)}<br>${esc(b.end)}</span>
      </div>`;}).join("") + `</div>`;
  } else {
    h += `<div class="empty">${state.blocks.length ? "Энэ өдөр хичээл, ажил, gym алга." : "Хичээл, ажил, gym-ийн цагаа нэг удаа оруулчихвал өдөр бүр энд гарч ирнэ."}${state.blocks.length?"":`<br><button class="linkbtn" data-act="new" data-kind="block">Хуваарь нэмэх</button>`}</div>`;
  }
  h += `</section>`;

  // routines
  h += `<section class="sec"><h2>Өдөр бүр</h2>`;
  if (it.routines.length){
    h += `<div class="list">` + it.routines.map(r => {
      const on = it.checked.has(r.id);
      return `<div class="row ${on?"done":""}">
        <button class="chk" data-act="tick" data-id="${r.id}" aria-label="Хийсэн гэж тэмдэглэх" aria-pressed="${on}">${CHECK}</button>
        <button class="body" data-act="edit" data-kind="routine" data-id="${r.id}"><span class="title">${esc(r.title)}</span></button>
        ${r.time?`<span class="time">${esc(r.time)}</span>`:""}
      </div>`;}).join("") + `</div>`;
  } else {
    h += `<div class="empty">Ус уух, сунгалт хийх гэх мэт өдөр бүр давтдаг зүйлсээ нэмээрэй.<br><button class="linkbtn" data-act="new" data-kind="routine">Давтагдах зүйл нэмэх</button></div>`;
  }
  h += `</section>`;

  // todos
  const late = isToday ? state.todos.filter(x=>x.date && x.date<k && !x.done).sort((a,b)=>a.date<b.date?-1:1) : [];
  const loose = isToday ? state.todos.filter(x=>!x.date && (!x.done || x.doneOn===k)) : [];
  const all = [...late.map(x=>[x,"late"]), ...it.todos.map(x=>[x,""]), ...loose.map(x=>[x,"loose"])];
  h += `<section class="sec"><h2>Хийх зүйлс</h2>`;
  if (all.length){

      else if (kind==="loose") txt = "Огноогүй";

      return `<div class="row ${x.done?"done":""}">
        <button class="chk" data-act="todo" data-id="${x.id}" aria-label="Хийсэн гэж тэмдэглэх" aria-pressed="${x.done}">${CHECK}</button>

  } else {
    h += `<div class="empty">Энэ өдөр хийх зүйл алга. Доорх + товчоор нэмнэ.</div>`;
  }
  h += `</section>`;

  // upcoming deadlines + exams
  if (isToday){
    const up = state.todos.filter(x => !x.done && x.date && x.date>k && dayDiff(t, fromKey(x.date)) <= (x.exam?30:7))
      .sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:tmin(a.time)-tmin(b.time));
    if (up.length){
      h += `<section class="sec"><h2>Удахгүй <em>7 хоног · шалгалт 30 хоног</em></h2><div class="list">` + up.map(x => {
        const d = fromKey(x.date), n = dayDiff(t, d);
        return `<div class="row">
          <button class="chk" data-act="todo" data-id="${x.id}" aria-label="Хийсэн гэж тэмдэглэх" aria-pressed="false">${CHECK}</button>

          <span class="cd ${n<=2?"soon":""}">${n===1?"Маргааш":n+" хоног"}</span>
        </div>`; }).join("") + `</div></section>`;
    }
  }
  if (syncNote) h += `<p class="sync">${esc(syncNote)}</p>`;
  app.innerHTML = h;
}

function gapRow(a,b){
  return `<div class="row gap"><span class="gap-t">Чөлөөт цаг · ${fmtDur(b-a)}</span><span class="time">${fromMin(a)}–${fromMin(b)}</span></div>`;
}

function nowNextHTML(){
  if (!state.blocks.length) return "";
  const t = today(), now = new Date(), m = now.getHours()*60+now.getMinutes();
  const bs = itemsFor(t).blocks;
  const cur = bs.filter(b => m>=tmin(b.start) && m<tmin(b.end));
  let nx = bs.find(b => tmin(b.start)>m), nxDay = 0;
  if (!nx) for (let i=1;i<=7;i++){ const b = itemsFor(addDays(t,i)).blocks[0]; if (b){ nx=b; nxDay=i; break; } }
  if (!cur.length && !nx) return "";
  const stripe = b => `<span class="stripe" style="background:var(${(CATS[b.cat]||CATS.other).v})"></span>`;
  const main = (lbl,b,extra="") => `<div class="nn-main"><span class="nn-lbl">${lbl}</span><span class="nn-t">${esc(b.title)}</span>${b.place?`<span class="sub">${esc(b.place)}</span>`:""}${extra}</div>`;
  let h = `<section class="nn" aria-label="Одоо ба дараагийнх">`;
  cur.forEach(b => {
    const s0=tmin(b.start), e=tmin(b.end), p=Math.round((m-s0)/(e-s0)*100);
    h += `<div class="nn-row">${stripe(b)}${main("Одоо",b,`<div class="nn-bar"><i style="width:${p}%"></i></div>`)}<div class="nn-when">${fmtDur(e-m)}<small>дуусахад</small></div></div>`;
  });
  if (nx){
    const when = nxDay ? esc(nx.start) : fmtDur(tmin(nx.start)-m);
    const small = nxDay ? (nxDay===1 ? "маргааш" : DAYS[wd(addDays(t,nxDay))]) : "дараа · "+esc(nx.start);
    h += `<div class="nn-row">${stripe(nx)}${main("Дараагийнх",nx)}<div class="nn-when">${when}<small>${small}</small></div></div>`;
  }
  return h + `</section>`;
}

  h += `<div class="card"><div class="hero-n">${tot?pct+"%":"–"}</div><div class="hero-s">${tot?`${dn}/${tot} зүйл хийсэн`:"Энэ долоо хоногт тэмдэглэсэн зүйл алга"}</div>

    return `<div class="bar ${+d===+t?"is-today":""}" title="${tip}"><div class="track ${fut?"fut":""}">${!fut&&x.done?`<i style="height:${Math.max(p,4)}%"></i>`:""}</div><small>${DS[i]}</small><small>${!fut&&x.total?`${x.done}/${x.total}`:"·"}</small></div>`;

  h += `<div class="tiles">
    <div class="tile"><b>${clsT?`${clsD}/${clsT}`:"–"}</b><span>Хичээл суусан</span></div>

    <div class="tile"><b${tdLate?' class="late"':""}>${tdLate}</b><span>Хоцорсон</span></div></div>`;

  if (state.routines.length){

    }).join("") + `<div class="legend"><span><i class="on"></i>хийсэн</span><span><i></i>хийгээгүй</span></div></div>`;
  }
  app.innerHTML = h;
}

/* ---------- calendar export (.ics) ---------- */
const icsEsc = v => String(v).replace(/\\/g,"\\\\").replace(/;/g,"\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");
function icsFold(line){
  const enc = new TextEncoder();
  if (enc.encode(line).length <= 75) return line;
  const out = []; let cur = "", n = 0;
  for (const ch of line){ const b = enc.encode(ch).length; if (n+b > 74){ out.push(cur); cur = " "+ch; n = 1+b; } else { cur += ch; n += b; } }
  out.push(cur); return out.join("\r\n");
}
function buildICS(f){
  const tz = (Intl.DateTimeFormat().resolvedOptions().timeZone) || "Asia/Ulaanbaatar";
  const off = -new Date().getTimezoneOffset();
  const offS = (off>=0?"+":"-")+pad(Math.floor(Math.abs(off)/60))+pad(Math.abs(off)%60);
  const ymd = d => d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());
  const hm = v => v.replace(":","")+"00";
  const utc = d => d.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
  const t = today(), stamp = utc(new Date());
  const until = fromKey(f.until); until.setHours(23,59,59);
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Udur//Udur//MN","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Өдөр","X-WR-TIMEZONE:"+tz,
    "BEGIN:VTIMEZONE","TZID:"+tz,"BEGIN:STANDARD","DTSTART:19700101T000000","TZOFFSETFROM:"+offS,"TZOFFSETTO:"+offS,"END:STANDARD","END:VTIMEZONE"];
  const alarm = (title, trig) => ["BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(title),"TRIGGER:"+trig,"END:VALARM"];
  let n = 0;
  state.blocks.filter(b=>f.cats.includes(b.cat)).forEach(b => b.days.forEach(day => {
    const first = addDays(t, (day - wd(t) + 7) % 7);
    if (first > until) return;
    n++;
    L.push("BEGIN:VEVENT","UID:"+b.id+"-"+day+"@udur","DTSTAMP:"+stamp,
      `DTSTART;TZID=${tz}:${ymd(first)}T${hm(b.start)}`, `DTEND;TZID=${tz}:${ymd(first)}T${hm(b.end)}`,
      "RRULE:FREQ=WEEKLY;UNTIL="+utc(until), "SUMMARY:"+icsEsc(b.title));
    if (b.place) L.push("LOCATION:"+icsEsc(b.place));
    if (f.remind) L.push(...alarm(b.title, "-PT"+f.remind+"M"));
    L.push("END:VEVENT");
  }));
  if (f.tasks){
    state.todos.filter(x=>!x.done && x.date && x.date>=key(t) && (x.cls||x.exam)).forEach(x => {
      n++;
      const d = fromKey(x.date), title = (x.exam?"Шалгалт: ":"")+x.title+(x.cls?" ("+shortCls(x.cls)+")":"");
      L.push("BEGIN:VEVENT","UID:"+x.id+"@udur","DTSTAMP:"+stamp,
        "DTSTART;VALUE=DATE:"+ymd(d), "DTEND;VALUE=DATE:"+ymd(addDays(d,1)), "SUMMARY:"+icsEsc(title),
        ...alarm(title, "-PT15H"), "END:VEVENT");   // 09:00 the day before
    });
  }
  L.push("END:VCALENDAR");
  return {text: L.map(icsFold).join("\r\n")+"\r\n", n};
}
function exportICS(viaShare){
  readInputs();
  const f = form, err = document.getElementById("f-err");
  const {text, n} = buildICS(f);
  if (!n){ err.textContent = "Нэмэх зүйл алга. Төрлөө сонгоно уу."; err.style.display="block"; return; }
  const name = "udur-huvaar.ics";
  if (viaShare && navigator.canShare){
    const file = new File([text], name, {type:"text/calendar"});
    if (navigator.canShare({files:[file]})){ navigator.share({files:[file]}).catch(()=>{}); return; }
  }
  const url = URL.createObjectURL(new Blob([text], {type:"text/calendar;charset=utf-8"}));
  const a = document.createElement("a"); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
}

/* ---------- sheet (add / edit) ---------- */
const sheet = document.getElementById("sheet"), sheetIn = document.getElementById("sheetIn"), scrim = document.getElementById("scrim");
let form = null;

function openSheet(kind, id, preset){
  if (kind==="cal"){
    const t = today(), m = t.getMonth();
    const until = m>=8 ? new Date(t.getFullYear(),11,31) : m<=0 ? new Date(t.getFullYear(),0,31) : m<=5 ? new Date(t.getFullYear(),5,15) : addDays(t,112);
    form = {kind:"cal", remind:10, cats:[...new Set(state.blocks.map(b=>b.cat))], until:key(until), tasks:true};
    drawSheet(); scrim.classList.add("open"); sheet.classList.add("open"); return;
  }
  let item = null;
  if (id){
    const src = kind==="block"?state.blocks:kind==="routine"?state.routines:state.todos;
    item = src.find(x=>x.id===id);
  }
  form = {
    kind, id: id||null,
    title: item?.title||"",
    cat: item?.cat || (kind==="block"?"class":"other"),
    days: item?.days ? [...item.days] : (kind==="routine" ? [0,1,2,3,4,5,6] : [wd(sel)]),
    start: item?.start || "09:00", end: item?.end || "10:30", place: item?.place||"",
    time: item?.time||"",
    date: item ? (item.date||"") : key(sel),
    nodate: item ? !item.date : false,
    cls: item?.cls || preset?.cls || "",
    exam: !!item?.exam
  };
  drawSheet();
  scrim.classList.add("open"); sheet.classList.add("open");
  setTimeout(()=>{ const i=document.getElementById("f-title"); if(i && !id) i.focus(); }, 260);
}
function closeSheet(){ sheet.classList.remove("open"); scrim.classList.remove("open"); form=null; }

function drawSheet(){
  const f = form, editing = !!f.id;
  if (f.kind==="cal"){
    const used = Object.entries(CATS).filter(([k])=>state.blocks.some(b=>b.cat===k));
    sheetIn.innerHTML = `<div class="grab"></div><button class="x" data-act="close" aria-label="Хаах">×</button><h2 id="sheetTitle">iPhone Calendar-т нэмэх</h2>
      <p class="hint" style="margin:-6px 0 16px">Хуваарь чинь Calendar-т долоо хоног бүр давтагдах үйл явдал болж орно. Ингэснээр апп хаалттай байсан ч утас чинь сануулна.</p>
      <div class="field"><span class="lbl">Хэдэн минутын өмнө сануулах</span><div class="chips">${[[0,"Үгүй"],[5,"5"],[10,"10"],[15,"15"],[30,"30"]].map(([v,l])=>`<button class="chip" data-f="remind" data-v="${v}" aria-pressed="${f.remind===v}">${l}</button>`).join("")}</div></div>
      <div class="field"><span class="lbl">Юуг оруулах</span><div class="chips">${used.map(([k,c])=>`<button class="chip cat" style="--cc:var(${c.v})" data-f="calcat" data-v="${k}" aria-pressed="${f.cats.includes(k)}">${c.n}</button>`).join("")}<button class="chip" data-f="caltasks" data-v="1" aria-pressed="${f.tasks}">Даалгавар, шалгалт</button></div></div>
      <div class="field"><label for="f-until">Хэдий хүртэл давтах (улирал дуусах өдөр)</label><input class="inp" type="date" id="f-until" value="${esc(f.until)}"></div>
      <p class="err" id="f-err"></p>
      <div class="actions"><button class="btn primary" data-act="export">Calendar файл татах</button></div>
      ${navigator.canShare ? `<div class="actions" style="margin-top:10px"><button class="btn" style="background:var(--soft)" data-act="exportshare">Share цэсээр нээх</button></div>` : ""}
      <p class="note">Файл нээгдэхэд <b>Add All</b> (Бүгдийг нэмэх) дар. Шууд нээгдэхгүй бол Files апп → Downloads → udur-huvaar.ics дээр дар.<br>Хуваариа өөрчилбөл Calendar-аас хуучныг нь устгаад дахин нэмээрэй, тэгэхгүй бол давхардана.</p>`;
    return;
  }
  const titles = {todo:"Хийх зүйл", block:"Хуваарь", routine:"Өдөр бүрийн зүйл"};
  let h = `<div class="grab"></div><button class="x" data-act="close" aria-label="Хаах">×</button><h2 id="sheetTitle">${editing?"Засах":"Шинээр нэмэх"}</h2>`;
  if (!editing) h += `<div class="seg" role="group" aria-label="Төрөл">${["todo","block","routine"].map(k=>`<button data-f="kind" data-v="${k}" aria-pressed="${f.kind===k}">${titles[k]}</button>`).join("")}</div>`;
  const ph = {todo:"Жишээ нь: лаб 5-ын тайлан бичих", block:"Жишээ нь: Компьютерын сүлжээ", routine:"Жишээ нь: 2 литр ус уух"}[f.kind];
  h += `<div class="field"><label for="f-title">Нэр</label><input class="inp" id="f-title" value="${esc(f.title)}" placeholder="${ph}" autocomplete="off"></div><p class="err" id="f-err">Нэрээ бичнэ үү.</p>`;

  if (f.kind==="todo"){
    h += `<div class="two">
      <div class="field"><label for="f-date">Огноо</label><input class="inp" type="date" id="f-date" value="${esc(f.date)}" ${f.nodate?"disabled":""}></div>
      <div class="field"><label for="f-time">Цаг (заавал биш)</label><input class="inp" type="time" id="f-time" value="${esc(f.time)}"></div></div>
      <label class="check-line"><input type="checkbox" id="f-nodate" ${f.nodate?"checked":""}> Огноогүй, хийх хүртэл өнөөдрийн жагсаалтад байлгах</label>`;
    const cl = classTitles();
    if (cl.length) h += `<div class="field" style="margin-top:14px"><span class="lbl">Аль хичээлийнх (заавал биш)</span><div class="chips">${cl.map(c=>`<button class="chip" data-f="cls" data-v="${esc(c)}" aria-pressed="${f.cls===c}">${esc(c)}</button>`).join("")}</div></div>`;
    h += `<label class="check-line"><input type="checkbox" id="f-exam" ${f.exam?"checked":""}> Шалгалт (30 хоногийн өмнөөс тоолж харуулна)</label>`;
  }
  if (f.kind==="block"){
    h += `<div class="field"><span class="lbl">Төрөл</span><div class="chips">${Object.entries(CATS).map(([k,c])=>`<button class="chip cat" style="--cc:var(${c.v})" data-f="cat" data-v="${k}" aria-pressed="${f.cat===k}">${c.n}</button>`).join("")}</div></div>`;
  }
  if (f.kind!=="todo"){
    h += `<div class="field"><span class="lbl">Өдрүүд</span><div class="chips">${DS.map((d,i)=>`<button class="chip" data-f="day" data-v="${i}" aria-pressed="${f.days.includes(i)}">${d}</button>`).join("")}</div></div>`;
  }
  if (f.kind==="block"){
    h += `<div class="two">
      <div class="field"><label for="f-start">Эхлэх</label><input class="inp" type="time" id="f-start" value="${esc(f.start)}"></div>
      <div class="field"><label for="f-end">Дуусах</label><input class="inp" type="time" id="f-end" value="${esc(f.end)}"></div></div>
      <div class="field"><label for="f-place">Байршил (заавал биш)</label><input class="inp" id="f-place" value="${esc(f.place)}" placeholder="Жишээ нь: 1-р байр 304" autocomplete="off"></div>`;
  }
  if (f.kind==="routine"){
    h += `<div class="field"><label for="f-time">Цаг (заавал биш)</label><input class="inp" type="time" id="f-time" value="${esc(f.time)}"></div>`;
  }
  if (f.kind==="block" && editing && f.cat==="class"){
    const orig = state.blocks.find(b=>b.id===f.id);
    if (orig) h += `<button class="linkbtn" data-act="newtask" data-cls="${esc(orig.title)}">+ Энэ хичээлд даалгавар, шалгалт нэмэх</button>`;
  }
  h += `<div class="actions">${editing?`<button class="btn danger" data-act="del">Устгах</button>`:""}<button class="btn primary" data-act="save">Хадгалах</button></div>`;
  sheetIn.innerHTML = h;
}
function readInputs(){
  const g = id => document.getElementById(id);
  if (g("f-title")) form.title = g("f-title").value;
  if (g("f-date")) form.date = g("f-date").value;
  if (g("f-time")) form.time = g("f-time").value;
  if (g("f-start")) form.start = g("f-start").value;
  if (g("f-end")) form.end = g("f-end").value;
  if (g("f-place")) form.place = g("f-place").value;
  if (g("f-nodate")) form.nodate = g("f-nodate").checked;
  if (g("f-exam")) form.exam = g("f-exam").checked;
  if (g("f-until")) form.until = g("f-until").value;
}
function save(){
  readInputs();
  const f = form, title = f.title.trim(), err = document.getElementById("f-err");
  if (!title){ err.textContent="Нэрээ бичнэ үү."; err.style.display="block"; return; }
  if (f.kind!=="todo" && !f.days.length){ err.textContent="Дор хаяж нэг өдөр сонгоно уу."; err.style.display="block"; return; }
  if (f.kind==="block" && tmin(f.end)<=tmin(f.start)){ err.textContent="Дуусах цаг эхлэх цагаас хойш байх ёстой."; err.style.display="block"; return; }
  const id = f.id || uid();
  let obj;
  if (f.kind==="todo"){
    const old = state.todos.find(x=>x.id===id);
    obj = {id, title, date: f.nodate?null:(f.date||key(sel)), time:f.time||"", done: old?old.done:false, doneOn: old?old.doneOn:null, cls: f.cls||"", exam: !!f.exam};
    upsert(state.todos, obj);
  } else if (f.kind==="block"){
    obj = {id, title, cat:f.cat, days:f.days.slice().sort(), start:f.start, end:f.end, place:f.place.trim()};
    upsert(state.blocks, obj);
  } else {
    obj = {id, title, days:f.days.slice().sort(), time:f.time||""};
    upsert(state.routines, obj);
  }
  persist(); closeSheet(); render();
}
function upsert(arr,obj){ const i=arr.findIndex(x=>x.id===obj.id); if(i>=0) arr[i]=obj; else arr.push(obj); }
function del(){
  const f=form;
  const name = f.kind==="block"?"blocks":f.kind==="routine"?"routines":"todos";
  state[name] = state[name].filter(x=>x.id!==f.id);
  for (const k in state.checks) state.checks[k] = state.checks[k].filter(i=>i!==f.id);
  persist(); closeSheet(); render();
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const tb = e.target.closest(".tab");
  if (tb){ tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  const fb = e.target.closest("[data-f]");
  if (fb && form){
    readInputs();
    const v = fb.dataset.v;
    if (fb.dataset.f==="kind"){ form.kind=v; if(v==="routine") form.days=[0,1,2,3,4,5,6]; else if(v==="block") form.days=[wd(sel)]; }
    if (fb.dataset.f==="cat") form.cat=v;
    if (fb.dataset.f==="cls") form.cls = form.cls===v ? "" : v;
    if (fb.dataset.f==="remind") form.remind = +v;
    if (fb.dataset.f==="calcat") form.cats = form.cats.includes(v) ? form.cats.filter(x=>x!==v) : [...form.cats, v];
    if (fb.dataset.f==="caltasks") form.tasks = !form.tasks;
    if (fb.dataset.f==="day"){ const n=+v; form.days = form.days.includes(n)?form.days.filter(x=>x!==n):[...form.days,n]; }
    drawSheet(); return;
  }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act;
  if (act==="pick"){ sel = fromKey(a.dataset.k); render(); }
  else if (act==="wk"){ sel = addDays(sel, +a.dataset.n); render(); }
  else if (act==="tick"){
    const k=key(sel), arr=state.checks[k]||[], id=a.dataset.id;
    state.checks[k] = arr.includes(id) ? arr.filter(x=>x!==id) : [...arr,id];
    persist(); render();
  }
  else if (act==="todo"){
    const x=state.todos.find(t=>t.id===a.dataset.id); if(!x) return;
    x.done=!x.done; x.doneOn = x.done ? key(today()) : null;
    persist(); render();
  }
  else if (act==="edit") openSheet(a.dataset.kind, a.dataset.id);
  else if (act==="new") openSheet(a.dataset.kind);
  else if (act==="save") save();
  else if (act==="del") del();
  else if (act==="cal") openSheet("cal");
  else if (act==="close") closeSheet();
  else if (act==="export") exportICS(false);
  else if (act==="exportshare") exportICS(true);
  else if (act==="newtask") openSheet("todo", null, {cls: a.dataset.cls});
  else if (act==="sw"){ statOff = Math.min(0, statOff + +a.dataset.n); render(); }
});
document.addEventListener("change", e => { if (e.target.id==="f-nodate"){ readInputs(); drawSheet(); } });
document.addEventListener("keydown", e => {
  if (e.key==="Escape" && form) closeSheet();
  if (e.key==="Enter" && form && form.kind!=="cal" && e.target.tagName==="INPUT" && e.target.type!=="checkbox") save();
});
document.getElementById("fab").addEventListener("click", () => openSheet(tab==="week"?"block":tab==="routines"?"routine":"todo"));
scrim.addEventListener("click", closeSheet);

// keep "today" fresh if the app stays open past midnight
let lastDay = key(today());
setInterval(() => { const k=key(today()); if(k!==lastDay){ if(key(sel)===lastDay) sel=today(); lastDay=k; render(); } else if(tab==="day") render(); }, 60000);
document.addEventListener("visibilitychange", () => { if(!document.hidden){ const k=key(today()); if(k!==lastDay){ if(key(sel)===lastDay) sel=today(); lastDay=k; } render(); } });

/* ---------- one-time import: class schedule ---------- */
(function seedClasses(){
  const TAG = "classes-v1";
  state.seeded = state.seeded || [];
  if (state.seeded.includes(TAG)) return;
  const C = [
    ["ICSI253","Алгоритмын шинжилгээ зохиомж",0,"07:40","09:10","Хич-8, 301 тоот"],
    ["ICSI204","Хиймэл оюун 1",0,"12:40","14:10","Хич-7, 107 тоот"],
    ["ICSI204","Хиймэл оюун 1",0,"14:20","16:45","Хич-8, 406 тоот"],
    ["ICSI303","Программ хангамжийн шаардлагын шинжилгээ",2,"09:20","10:50","Хич-7, 406 тоот"],
    ["ECEN213","Компьютерын сүлжээ",2,"11:00","13:25","Хич-7, 401 тоот"],
    ["ICSI303","Программ хангамжийн шаардлагын шинжилгээ",2,"14:20","15:50","Хич-8, 402 тоот"],
    ["ECEN213","Компьютерын сүлжээ",2,"16:00","17:30","Хич-7, 209 тоот"],
    ["ICSI253","Алгоритмын шинжилгээ зохиомж",3,"07:40","09:10","Хич-7, 207 тоот"],
    ["CSII201","Программчлалын хэл",3,"11:00","12:30","Хич-7, 107 тоот"],
    ["CSII201","Программчлалын хэл",3,"12:40","15:05","Хич-8, 208 тоот"]
  ];
  C.forEach(([code,name,day,start,end,place],i) => {
    const id = "cls"+i;
    if (!state.blocks.some(b=>b.id===id))
      state.blocks.push({id, title:name, cat:"class", days:[day], start, end, place: place+", "+code});
  });
  state.seeded.push(TAG);
  persist();
})();

render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
